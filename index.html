  <script>
    // -----------------
    // IndexedDB Setup
    // -----------------
    let db;
    const request = indexedDB.open("PipelineDB", 1);

    request.onupgradeneeded = (event) => {
      db = event.target.result;
      if (!db.objectStoreNames.contains("runs")) {
        db.createObjectStore("runs", { keyPath: "id" });
      }
    };

    request.onsuccess = (event) => {
      db = event.target.result;
      loadHistoryDropdown();
    };

    request.onerror = (event) => {
      console.error("IndexedDB error:", event.target.errorCode);
    };

    function saveRun(run) {
      const tx = db.transaction("runs", "readwrite");
      const store = tx.objectStore("runs");
      store.put(run);
      tx.oncomplete = () => loadHistoryDropdown();
    }

    function getAllRuns(callback) {
      const tx = db.transaction("runs", "readonly");
      const store = tx.objectStore("runs");
      const request = store.getAll();
      request.onsuccess = () => callback(request.result);
    }

    function loadHistoryDropdown() {
      getAllRuns((runs) => {

      if (!id) return;
      const tx = db.transaction("runs", "readonly");
      const store = tx.objectStore("runs");
      const request = store.get(id);
      request.onsuccess = () => {
        const run = request.result;
        if (run) displayResults(run.results);
      };
    }

    // -----------------
    // Pipeline Call
    // -----------------
    async function generate() {
      const projectName = document.getElementById("projectName").value.trim();
      const brdText = document.getElementById("brdInput").value;
